# n8n para el bot demo de WhatsApp de NodOpera
# Corre en la PC de la oficina (WSL Ubuntu). Uso: ./instalar.sh  (o: docker compose up -d)
name: nodopera-n8n
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.3   # versión fija: probada con el bot. Actualizar a mano.
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"   # solo local; el túnel publica únicamente la ruta del webhook (lo demás 404)
    env_file: .env
    environment:
      N8N_HOST: wa.nodopera.com
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://wa.nodopera.com/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: America/Mexico_City
      TZ: America/Mexico_City
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # el nodo Bot lee WA_TOKEN / WA_APP_SECRET de este .env ($env)
      NODE_FUNCTION_ALLOW_BUILTIN: crypto      # para validar la firma X-Hub-Signature-256
      N8N_SECURE_COOKIE: "false"              # el editor se abre por http://localhost (túnel SSH)
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"          # guarda 7 días de ejecuciones
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/import/workflows:ro
volumes:
  n8n-data:
